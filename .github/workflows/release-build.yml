name: Build & Publish ImpressCMS Module

on:
  release:
    types: [published]

permissions:
  contents: write   # <-- VERPLICHT voor release uploads

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, json, zip
          coverage: none

      - name: Determine module name from repository
        run: echo "MODULE_NAME=${{ github.event.repository.name }}" >> $GITHUB_ENV

      - name: Extract version from release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # The module (and its composer.json) lives in src/, not in the repository root
      - name: Check that the release tag matches the module version
        run: |
          MODULE_VERSION=$(sed -n "s/^\$modversion\['version'\] = '\(.*\)';/\1/p" src/icms_version.php)
          if [ "${MODULE_VERSION}" != "${VERSION}" ]; then
            echo "::error::Release ${VERSION} does not match the version in src/icms_version.php (${MODULE_VERSION})"
            exit 1
          fi

      - name: Install Composer dependencies (no dev)
        working-directory: src
        run: composer install --no-dev --no-interaction --optimize-autoloader

      - name: Build the module package
        run: php bin/build-release.php "${VERSION}"

      - name: Upload package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODULE_NAME }}-${{ env.VERSION }}
          path: build/${{ env.MODULE_NAME }}-${{ env.VERSION }}.zip
          if-no-files-found: error

      - name: Upload ZIP to GitHub Release (GH CLI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} build/${MODULE_NAME}-${VERSION}.zip --clobber
