name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: PHP syntax check
        run: find src -path src/vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Extension point tests
        run: php tests/run.php
